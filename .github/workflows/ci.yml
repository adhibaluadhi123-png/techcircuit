name: CANON CI - Full-Stack Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Security, Audit & Invariant Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Run Backend Pytest Suite
        working-directory: ./backend
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-for-ci-runs
          DATABASE_URL: sqlite:///:memory:
          ALLOW_MOCK_LLM_FALLBACK: true
        run: |
          pytest tests/ -v --tb=short

  frontend-checks:
    name: Frontend Lint, Typecheck & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
        run: npm run build
